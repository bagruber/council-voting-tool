name: Deploy auf moosburg.eu/abstimmung/

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-abstimmung
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Das FTP-Login landet bereits im Document-Root der Domain. Ein
      # vorangestelltes public_html/ würde dort einen zweiten, über das Web
      # sichtbaren Ordner anlegen statt in die Wurzel zu schreiben.
      - name: Nach abstimmung/ spiegeln
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: abstimmung/

          # Alle Projekte teilen sich ein FTP-Konto. Kurz nach einer anderen
          # Übertragung nimmt Hostinger die Verbindung verzögert an, und die
          # 30 s Standard-Timeout der Action reichen dann nicht.
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.md
