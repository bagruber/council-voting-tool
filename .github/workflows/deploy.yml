name: Deploy auf moosburg.eu/abstimmung/

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-abstimmung
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nach public_html/abstimmung/ spiegeln
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: public_html/abstimmung/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.md
