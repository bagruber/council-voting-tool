name: Deploy auf moosburg.eu/abstimmung/

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-abstimmung
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm test
      - run: pnpm run build

      # Das FTP-Login landet bereits im Document-Root der Domain. Ein
      # vorangestelltes public_html/ würde dort einen zweiten, über das Web
      # sichtbaren Ordner anlegen statt in die Wurzel zu schreiben.
      - name: Nach abstimmung/ spiegeln
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: abstimmung/

          # Neuer State-Dateiname seit der Umstellung auf dist/-Deploys: der
          # alte State beschrieb die js/-Struktur der Vorgaenger-Version und
          # liess die Action ins Leere loeschen. Die Altdateien im Ordner
          # (js/, members.json, tagesordnung/, alter State) sind verwaist und
          # koennen per hPanel-Dateimanager entfernt werden.
          state-name: .ftp-deploy-sync-state-v2.json

          # Alle Projekte teilen sich ein FTP-Konto. Kurz nach einer anderen
          # Übertragung nimmt Hostinger die Verbindung verzögert an, und die
          # 30 s Standard-Timeout der Action reichen dann nicht.
          timeout: 120000
