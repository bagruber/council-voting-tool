name: Deploy auf moosburg.eu/abstimmung/

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-abstimmung
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm test
      - run: pnpm run build

      # Eigenes FTP-Konto, in hPanel auf den Ordner abstimmung beschränkt: Das
      # Login beginnt dort, deshalb unten server-dir ./. Gehören die Secrets zu
      # einem anderen Konto oder liegt das Login in der Domain-Wurzel, bricht
      # der Deploy hier ab, bevor etwas übertragen wird (moosburg-eu/BRIEFING.md).
      - name: Ziel prüfen
        env:
          KONTO: abstimmung
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -o pipefail
          case "$FTP_USER" in
            *"$KONTO") ;;
            *) echo "FTP_USER ist nicht das Konto $KONTO. Abbruch."; exit 1 ;;
          esac
          liste=$(curl -sS --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" --list-only "ftp://$FTP_HOST/" | tr -d '\r')
          if grep -qx stadtrat <<< "$liste" && grep -qx abstimmung <<< "$liste"; then
            echo "Das Login liegt in der Domain-Wurzel. Abbruch."; exit 1
          fi

      - name: Nach abstimmung/ spiegeln
        # v4.4.0, auf den Commit gepinnt: Ein verschobener Tag soll nicht
        # unbemerkt anderen Code an das FTP-Passwort bringen.
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # Prüft das Zertifikat. FTP_HOST ist deshalb srv1973.hstgr.io: Das
          # Zertifikat lautet auf *.hstgr.io, ftp.moosburg.eu passt nicht dazu.
          security: strict
          local-dir: ./dist/
          server-dir: ./

          # Neuer State-Dateiname seit der Umstellung auf dist/-Deploys: der
          # alte State beschrieb die js/-Struktur der Vorgaenger-Version und
          # liess die Action ins Leere loeschen. Die Altdateien im Ordner
          # (js/, members.json, tagesordnung/, alter State) sind verwaist und
          # koennen per hPanel-Dateimanager entfernt werden.
          state-name: .ftp-deploy-sync-state-v2.json

          # Kurz nach einer anderen Übertragung nimmt Hostinger die Verbindung
          # verzögert an; die 30 s Standard-Timeout reichen dann nicht.
          timeout: 120000
